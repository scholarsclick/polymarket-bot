# ===========================================================================
# Polymarket short-term crypto bot — example configuration.
# Copy to `config.yaml` and tune. `config.yaml` is gitignored.
# Secrets (private key, API creds) live in `.env`, NOT here.
# ===========================================================================

# --- Connection ------------------------------------------------------------
clob_host: "https://clob.polymarket.com"
gamma_host: "https://gamma-api.polymarket.com"
chain_id: 137                 # Polygon mainnet

# signature_type: 0 = EOA wallet, 1 = email/Magic proxy, 2 = browser wallet proxy
signature_type: 1
# funder: Polymarket proxy address that holds your USDC.
# Required for signature_type 1 and 2. For type 0 leave blank (uses the EOA).
funder: ""

# --- Mode ------------------------------------------------------------------
# true  = paper trading, no real orders are sent (default, safe).
# false = LIVE trading with real funds. Can also be forced with --live / --dry-run.
dry_run: true

# --- Which markets to trade ------------------------------------------------
symbols: ["BTC", "ETH", "SOL", "XRP", "DOGE", "BNB", "HYPE"]   # more symbols = more markets/trades
durations_minutes: [5, 15]         # candle lengths to trade (also tries 1, 60 if listed)
duration_tolerance_seconds: 90     # how loosely to match a market's window to a duration

# Only enter when remaining time to resolution is inside this window.
# Avoid the very end (no time for edge to realize / fills risky) and the very
# start (too little signal yet).
min_seconds_to_resolution: 25
max_seconds_to_resolution: 900     # full 15m window stays visible/eligible

# --- Price feed ------------------------------------------------------------
# Spot price sources, tried in order until one responds.
price_sources: ["binance", "coinbase", "kraken"]
vol_window_seconds: 300            # rolling window for realized-vol estimate
vol_floor_annual: 0.40             # floor on annualized vol so the model isn't overconfident
vol_ceiling_annual: 2.50           # cap to ignore microstructure spikes

# --- Strategy --------------------------------------------------------------
strategy: "momentum"               # "momentum" (see polybot/strategy.py to add more)
min_edge: 0.05                     # required (fair - price) edge, after fees, to trade
max_price: 0.95                    # never pay above this per share
min_price: 0.05                    # never buy below this (no real upside)
taker_fee_bps: 0                   # Polymarket taker fee in bps (currently 0); used in edge calc

# --- Risk limits -----------------------------------------------------------
bankroll_usd: 200.0                # assumed working capital for sizing
kelly_fraction: 0.25               # fraction of full Kelly to bet (0.25 = quarter Kelly)
max_position_usd: 25.0             # max notional per market
max_total_exposure_usd: 100.0      # max notional across all open positions
max_open_positions: 12             # raise for more concurrent trades
max_trades_per_market: 1           # one entry per market window
daily_loss_limit_usd: 50.0         # absolute daily loss halt (used only if pct <= 0)
daily_loss_limit_pct: 0.5          # STOP for the day after losing this fraction of capital (0.5 = 50%)
max_consecutive_losses: 5          # (disabled in live for max-trades; daily pct is the real guard)

# --- Exits / trade management ----------------------------------------------
# Early exits are OFF: every trade is HELD until the market resolves.
enable_early_exits: false
trailing_stop_pct: 0.15           # (only used if enable_early_exits is true)
time_exit_seconds: 30
confidence_exit: true
exit_confidence_min: 2
volatility_exit: true
volatility_exit_mult: 3.0

# --- Intelligence: entry quality + adaptive sizing -------------------------
max_spread: 0.10                  # skip markets whose YES book spread exceeds this (0 = off)
min_liquidity: 0.0                # skip markets with less than this total book size (0 = off)
confidence_sizing: true           # scale position size by signal confidence
confidence_sizing_min_mult: 0.5
confidence_sizing_max_mult: 1.5
avoid_rsi_extremes: true          # don't buy into overbought / oversold exhaustion
rsi_overbought: 80.0
rsi_oversold: 20.0

# --- Self-learning model ---------------------------------------------------
# Learns from every closed trade which signals actually predict correct trades,
# then gates/sizes entries by the learned probability. Cold-starts on rules only.
learning_enabled: true
learning_min_samples: 25          # trades needed before the model influences anything
learning_gate: false              # false = model only SIZES trades; true = it can BLOCK weak ones
learning_min_prob: 0.45           # gate threshold (only used when learning_gate is true)
learning_explore_rate: 0.2        # when gating, still take this fraction to keep learning
learning_lr: 0.05
learning_size_weight: true        # scale position size by the model's P(correct)

# --- Loop ------------------------------------------------------------------
poll_interval_seconds: 3           # how often to re-evaluate active markets
market_refresh_seconds: 30         # how often to re-discover markets from Gamma
log_level: "INFO"
state_dir: "state"                 # where paper positions / journal are written
